      .boot-card > div { width: min(100%, 340px); padding: 26px; box-sizing: border-box; text-align: center; background: #fffbee; border: 1px solid #c9ac6c; border-radius: 14px; box-shadow: 0 4px 0 #d8cfb6; }

    <script>
      (() => {
        document.documentElement.classList.add('boot-script');
        let resourceFailed = false, show, deadline;
        const paint = (text, failed) => {
          const card = document.getElementById('boot-card');
          if (!card) {
            document.addEventListener('DOMContentLoaded', () => paint(text, failed), { once: true });
            return;
          }
          card.querySelector('p').textContent = text;
          card.querySelector('button').hidden = !failed;
          card.hidden = false;
        };
        const stop = () => { clearTimeout(show); clearTimeout(deadline); };
        window.biblibBoot = {
          start() { return !resourceFailed; },
          begin(text = '図書館の準備をしています…') {
            if (resourceFailed) return;
            stop();
            show = setTimeout(() => paint(text, false), 300);
            deadline = setTimeout(() => window.biblibBoot.fail(), 12000);
          },
          ready() {
            if (resourceFailed) return;
            stop();
            document.getElementById('boot-card').hidden = true;
          },
          fail() {
            stop();
            paint('図書館を開けませんでした。接続を確認して、もう一度お試しください。', true);
          },
        };
        window.addEventListener('error', event => {
          const node = event.target;
          if (!node?.hasAttribute?.('data-boot-optional') && (node?.tagName === 'SCRIPT' ||
              (node?.tagName === 'LINK' && ['stylesheet', 'modulepreload'].includes(node.rel)))) {
            resourceFailed = true;
            window.biblibBoot.fail();
          }
        }, true);
        window.biblibBoot.begin();
      })();
    </script>
